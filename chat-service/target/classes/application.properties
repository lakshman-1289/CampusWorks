# Server Configuration
server.port=9005

# Application Configuration
spring.application.name=chat-service

# MongoDB Configuration
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/campuschat}

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# JWT Configuration
security.jwt.secret=${JWT_SECRET:CHANGE_ME_SECRET_KEY_FOR_PRODUCTION_USE_256_BIT}

# Management Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Chat Service Configuration
app.chat.message.max-length=1000
app.chat.file.max-size-mb=10
app.chat.file.allowed-types=jpg,jpeg,png,pdf,doc,docx

# WebSocket Configuration
app.websocket.allowed-origins=http://localhost:3000,http://localhost:3001

# Logging Configuration
logging.level.com.campusworks.chat=DEBUG