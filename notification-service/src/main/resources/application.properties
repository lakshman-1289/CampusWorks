# Server Configuration
server.port=9007

# Application Configuration
spring.application.name=notification-service

# MongoDB Configuration
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/campusnotify}

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# JWT Configuration
security.jwt.secret=${JWT_SECRET:CHANGE_ME_SECRET_KEY_FOR_PRODUCTION_USE_256_BIT}

# Management Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Notification Service Configuration
app.notification.email.enabled=true
app.notification.push.enabled=false
app.notification.sms.enabled=false

# Firebase Configuration (for push notifications)
app.firebase.project-id=${FIREBASE_PROJECT_ID:campusworks-project}
app.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:firebase-credentials.json}

# Logging Configuration
logging.level.com.campusworks.notification=DEBUG