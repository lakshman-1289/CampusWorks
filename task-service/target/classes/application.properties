# Server Configuration
server.port=9002

# Application Configuration
spring.application.name=task-service

# Spring Cloud Config Import (replaces bootstrap.properties)
spring.config.import=optional:configserver:http://localhost:8888/

# Config Server Connection Settings
spring.cloud.config.uri=http://localhost:8888
spring.cloud.config.fail-fast=false
spring.cloud.config.retry.initial-interval=1000
spring.cloud.config.retry.max-attempts=6
spring.cloud.config.retry.max-interval=2000

spring.cloud.config.username=admin
spring.cloud.config.password=admin123

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/taskdb?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Management Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Task Service Specific Configuration
app.task.bidding-window-hours=24
app.task.auto-assignment-enabled=true

# Logging Configuration
logging.level.com.campusworks.task=DEBUG