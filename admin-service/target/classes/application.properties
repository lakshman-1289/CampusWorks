# Server Configuration
server.port=9009

# Application Configuration
spring.application.name=admin-service

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/admindb?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# JWT Configuration
security.jwt.secret=${JWT_SECRET:CHANGE_ME_SECRET_KEY_FOR_PRODUCTION_USE_256_BIT}

# Management Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Admin Service Configuration
app.admin.super-admin-email=${SUPER_ADMIN_EMAIL:admin@campusworks.com}
app.admin.platform.commission=5.0
app.admin.analytics.enabled=true

# Logging Configuration
logging.level.com.campusworks.admin=DEBUG