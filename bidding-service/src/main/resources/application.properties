# Server Configuration
server.port=9004

# Application Configuration
spring.application.name=bidding-service

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/biddingdb?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# JWT Configuration
security.jwt.secret=${JWT_SECRET:CHANGE_ME_SECRET_KEY_FOR_PRODUCTION_USE_256_BIT}

# Management Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Bidding Service Specific Configuration
app.bidding.min-bid-increment=0.50
app.bidding.max-bids-per-user-per-task=1
app.bidding.winner-selection-delay-minutes=5

# Logging Configuration
logging.level.com.campusworks.bidding=DEBUG