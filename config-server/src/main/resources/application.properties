# Server Configuration
server.port=8888
spring.application.name=config-server



# Disable unnecessary auto-configurations
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

## Enable native profile for local testing (comment out for GitHub)
#spring.profiles.active=native
#
## Alternative: Native (file-based) configuration for testing
#spring.cloud.config.server.native.search-locations=classpath:/config/

# Config Server Git Configuration (Simple Setup)
# For testing - you can switch between git and file-based config
spring.cloud.config.server.git.uri=${CONFIG_GIT_URI:https://github.com/lakshman-1289/campusworks-config.git}
spring.cloud.config.server.git.clone-on-start=false
spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.timeout=10
spring.cloud.config.server.git.skip-ssl-validation=false

# GitHub Authentication (if private repository)
spring.cloud.config.server.git.username=${CONFIG_GIT_USERNAME:lakshman-1289}
spring.cloud.config.server.git.password=${CONFIG_GIT_TOKEN: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}

# Config Server Security (Simple)
spring.security.user.name=${CONFIG_SERVER_USERNAME:admin}
spring.security.user.password=${CONFIG_SERVER_PASSWORD:admin123}

# Management Endpoints
management.endpoints.web.exposure.include=health,info,refresh
management.endpoint.health.show-details=always

# Logging
logging.level.org.springframework.cloud.config=DEBUG
logging.level.org.eclipse.jgit=DEBUG