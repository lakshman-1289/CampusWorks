# Server Configuration
server.port=9003

# Application Configuration
spring.application.name=profile-service

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/profiledb?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# JWT Configuration
security.jwt.secret=${JWT_SECRET:CHANGE_ME_SECRET_KEY_FOR_PRODUCTION_USE_256_BIT}

# Management Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Profile Service Configuration
app.profile.verification.required=true
app.profile.image.max-size-mb=5
app.profile.image.allowed-types=jpg,jpeg,png

# Logging Configuration
logging.level.com.campusworks.profile=DEBUG