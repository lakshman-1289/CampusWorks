# Server Configuration
server.port=9001

# Application Configuration
spring.application.name=auth-service

# Spring Cloud Config Import (replaces bootstrap.properties)
spring.config.import=optional:configserver:http://localhost:8888/

# Config Server Connection Settings
spring.cloud.config.uri=http://localhost:8888
spring.cloud.config.fail-fast=false
spring.cloud.config.retry.initial-interval=1000
spring.cloud.config.retry.max-attempts=6
spring.cloud.config.retry.max-interval=2000

spring.cloud.config.username=admin
spring.cloud.config.password=admin123

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/authdb?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:lakshmanindependent@gmail.com}
spring.mail.password=${MAIL_PASSWORD:tsji spws kyxr wfnw}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Frontend URLs Configuration
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.frontend.additional-urls=${FRONTEND_ADDITIONAL_URLS:http://localhost:3001}
app.frontend.verify-email-path=/verify-email
app.frontend.reset-password-path=/reset-password

# Management Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Logging Configuration
logging.level.com.campusworks.auth=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.cloud.config=DEBUG
logging.level.org.springframework.web.client.RestTemplate=DEBUG
logging.level.org.springframework.boot.context.config=DEBUG

